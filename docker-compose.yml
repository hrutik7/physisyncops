services:
  web:
    build: ./apps/web
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opentra
      POSTGRES_USER: opentra
      POSTGRES_PASSWORD: opentra
    ports:
      - "5432:5432"
    volumes:
      - opentra-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  opentra-postgres:
